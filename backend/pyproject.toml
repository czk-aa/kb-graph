[project]
name = "kb-graph-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: 需要真实 LLM/Embedding 的集成测试",
]

[tool.ruff]
line-length = 110
